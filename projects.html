<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Projects | Game Developer Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo">
                <i class="fas fa-gamepad"></i>GameDev Projects
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Projects Header -->
    <section class="hero" id="projects-header">
        <div class="container">
            <div class="hero-content">
                <h1><span>My</span> Unreal Engine <span>Projects</span></h1>
                <p>Explore my portfolio of games, plugins, and tools created with Unreal Engine</p>
            </div>
        </div>
    </section>

    <!-- Filter Section -->
    <section id="filter-section">
        <div class="container">
            <div class="filter-controls">
                <h3>Filter Projects</h3>
                <div class="filter-group">
                    <select id="type-filter">
                        <option value="all">All Types</option>
                        <option value="game">Game</option>
                        <option value="plugin">Plugin</option>
                        <option value="tool">Tool</option>
                        <option value="feature">Feature</option>
                        <option value="template">Template</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <option value="vr">VR</option>
                        <option value="ai">AI</option>
                        <option value="networking">Networking</option>
                        <option value="physics">Physics</option>
                        <option value="vfx">VFX</option>
                    </select>
                </div>
                <div class="filter-group">
                    <input type="text" id="search-filter" placeholder="Search projects...">
                </div>
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="all-projects">
        <div class="container">
            <div class="projects-grid" id="projects-container">
                <!-- Projects will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">GameDev Projects</div>
                <p class="copyright">© 2023 Game Developer Projects. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/projects.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
